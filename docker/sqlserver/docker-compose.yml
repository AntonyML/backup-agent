version: '3.8'

services:
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: femucaribe-sqlserver-test
    environment:
      - ACCEPT_EULA=Y
      # CREDENCIAL FICTICIA EXCLUSIVA PARA ENTORNO DE PRUEBAS / TESTING
      # NUNCA MODIFICAR POR CREDENCIALES DE PRODUCCIÓN
      - MSSQL_SA_PASSWORD=TestPassw0rd!123
      - MSSQL_PID=Developer
    ports:
      - "${TEST_SQLSERVER_PORT:-14333}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPassw0rd!123' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    volumes:
      - sqlserver-test-data:/var/opt/mssql

volumes:
  sqlserver-test-data:
