name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Compilar Binario Go (Release)
        run: |
          go build -v -ldflags="-s -w" -o bin/backup-agent.exe ./cmd/backup-agent

      - name: Compilar Instalador con Inno Setup
        uses: knopp/github-action-innosetup@v3
        with:
          options: /O+
          filepath: installer.iss

      - name: Subir Instalador y Binario como Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: BackupAgent-Windows
          path: |
            dist/*.exe
            bin/backup-agent.exe
          retention-days: 30

      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            bin/backup-agent.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
