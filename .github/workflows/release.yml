name: Build and Release Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular Próxima Versión Semántica
        id: semver
        shell: pwsh
        run: |
          $exactTag = (git tag --points-at HEAD) | Where-Object { $_ -match "^v\d" } | Select-Object -First 1
          if ($exactTag) {
            $version = $exactTag.TrimStart('v')
            $versionTag = $exactTag
          } else {
            $latestTag = (git tag -l "v*" --sort=-v:refname) | Select-Object -First 1
            if (-not $latestTag) {
              $version = "4.0.0"
            } else {
              $clean = $latestTag.TrimStart('v')
              $parts = $clean.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2]

              $commits = git log "$latestTag..HEAD" --oneline
              $isMajor = $false
              $isMinor = $false
              $hasCommits = $false

              foreach ($c in $commits) {
                if (-not [string]::IsNullOrWhiteSpace($c)) {
                  $hasCommits = $true
                  if ($c -match "(?i)BREAKING CHANGE|breaking:") {
                    $isMajor = $true
                  } elseif ($c -match "(?i)feat(\([^\)]+\))?:") {
                    $isMinor = $true
                  }
                }
              }

              if ($isMajor) {
                $major++
                $minor = 0
                $patch = 0
              } elseif ($isMinor) {
                $minor++
                $patch = 0
              } elseif ($hasCommits) {
                $patch++
              }
              $version = "$major.$minor.$patch"
            }
            $versionTag = "v$version"
          }
          Write-Host "Versión calculada: $version (Tag: $versionTag)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_tag=$versionTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Compilar Binario Go con Versión Inyectada
        run: |
          New-Item -ItemType Directory -Force -Path bin
          $ver = "${{ steps.semver.outputs.version }}"
          Write-Host "Compilando Backup Agent versión $ver..."
          go build -v -ldflags="-s -w -X femucaribe-backup-agent/internal/version.Current=$ver" -o bin/backup-agent.exe ./cmd/backup-agent

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress

      - name: Compilar Instalador con Inno Setup
        run: |
          $iscc = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { "iscc.exe" }
          $ver = "${{ steps.semver.outputs.version }}"
          Write-Host "Compilando instalador Inno Setup con versión $ver..."
          & $iscc /O+ /DMyAppVersion=$ver installer.iss

      - name: Subir Instalador y Binario como Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: BackupAgent-v${{ steps.semver.outputs.version }}-Windows
          path: |
            dist/*.exe
            bin/backup-agent.exe
          retention-days: 30

      - name: Crear GitHub Release y Tag Automático
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.version_tag }}
          name: Release ${{ steps.semver.outputs.version_tag }}
          files: |
            dist/*.exe
            bin/backup-agent.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
